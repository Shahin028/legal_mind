name: legal_mind
description: AI Powered Legal Assistant App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # iOS style icons
  cupertino_icons: ^1.0.8

  # API requests
  http: ^1.2.1

  # Local storage (login session)
  shared_preferences: ^2.2.2

  # Network images for legal news
  cached_network_image: ^3.3.1

  # Loading animations
  flutter_spinkit: ^5.2.0

  # Better fonts
  google_fonts: ^6.1.0

  # Open URLs in browser
  url_launcher: ^6.3.0

  # Render LLM markdown responses
  flutter_markdown: ^0.7.4

  # Image picker (gallery + camera) — Document Analysis
  image_picker: ^1.1.2

  # File picker (PDF) — Document Analysis
  file_picker: ^8.0.0+1

  # PDF text extraction — Document Analysis
  syncfusion_flutter_pdf: ^24.1.41

  # On-device OCR for images — Document Analysis
  google_mlkit_text_recognition: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/